spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/intellectual
    username: intellectual
    password: intellectual
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes in ms

minio:
  endpoint: http://127.0.0.1:9000
  access-key: intellectual
  secret-key: intellectual123
  bucket: dish-photos

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
