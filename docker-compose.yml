services:
  postgres:
    image: postgres:16-alpine
    container_name: intellectual-postgres
    environment:
      POSTGRES_DB: intellectual
      POSTGRES_USER: intellectual
      POSTGRES_PASSWORD: intellectual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellectual"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intellectual-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: intellectual-minio
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: intellectual
      MINIO_ROOT_PASSWORD: intellectual123
    ports:
      - "9000:9000"   # S3 API  (used by Spring)
      - "9090:9090"   # Web console  → http://localhost:9090
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
